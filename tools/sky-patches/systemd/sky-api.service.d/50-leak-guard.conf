# Drop-in for the SkyPilot API server unit on a 4 vCPU / 16 GB host.
# Install: copy to /etc/systemd/system/sky-api.service.d/, then
#   systemctl daemon-reload && systemctl restart sky-api
# Check first with `systemctl cat sky-api` that the unit runs the server in the
# foreground (Type=simple/exec). If ExecStart daemonizes (e.g. `sky api start`),
# Restart= and the cgroup limits still apply to the cgroup, but systemd may
# not see the real main process.
[Service]
# Restart the server instead of letting the host freeze.
Restart=always
RestartSec=15
# Throttle at 10 GiB, kill the unit (not sshd/journald) at 12 GiB.
MemoryHigh=10G
MemoryMax=12G
MemorySwapMax=0
# Each leaked Nebius SDK holds one thread; cap threads well below kernel limits.
TasksMax=8192
# Leave one vCPU for sshd, journald and systemd-resolved.
CPUQuota=300%
