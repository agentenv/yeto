# S29 120B: one Nebius 8-GPU VM running the 120B rollout island (vm120_run.sh).
# Normally launched by vm_watchdog.py, which walks the candidates (on-demand H100 eu-north1 first,
# then spot H100 eu-north1 / H200 eu-west1, eu-north1, us-central1 by price) with
# --infra nebius/<region> --gpus <H100|H200>:8 --[no-]use-spot --env CARD=<gpu> --env TP=8.
# Prices differ: H100:8 $36 od / $6.32 spot; H200:8 $43.20 od / $11.20-39.92 spot (2026-11-02).
#   by hand: sky launch -c s29r-120 tools/probes/s29_spot/sky_spot120.yaml --infra nebius/eu-north1 \
#     --secret BOAT_API_KEY --secret MODAL_TOKEN_ID --secret MODAL_TOKEN_SECRET --env RUN_ID=... -d -y
#   S30 P0-b (releases from S3, no dev machine in the path): add
#     --env S3_DELIVERY=1 --env S3_PREFIX=<run> --env S3_REGION=<region> --env S3_BUCKET=<bucket> \
#     --secret AWS_ACCESS_KEY_ID --secret AWS_SECRET_ACCESS_KEY
resources:
  use_spot: true
  accelerators: H100:8  # candidates: {H100,H200}:8 (vm_watchdog.candidates)
  disk_size: 1500
  ports: 31600
  image_id: docker:ghcr.io/michaellchung/yeto-miles-ports@sha256:d639e258709b9d4ae4a980c63818562daf62137c9e364f779010bc0b753e867a
envs:
  RUN_ID: ""
  ISLAND: spot-0  # sampler id / shard / boat label island
  WEIGHT_SWITCH: auto  # auto (live on this engine) | drain | live
  S3_DELIVERY: "0"
  S3_PREFIX: ""  # required with S3_DELIVERY=1
  S3_REGION: ""  # required with S3_DELIVERY=1
  CARD: H100  # GPU kind (nvidia-smi self-check); must match --gpus
  TP: "8"
  BOAT_STARTS_PER_HOUR: "60"  # D18-1: >= max_in_flight x 2 x groups/h
secrets:
  BOAT_API_KEY: null
  MODAL_TOKEN_ID: null
  MODAL_TOKEN_SECRET: null
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
file_mounts:
  /root/yeto-root: /tmp/s29r/payload/yeto-root
run: |
  bash /root/yeto-root/tools/probes/s29_spot/vm120_run.sh
