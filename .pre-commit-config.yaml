repos:
  - repo: local
    hooks:
      - id: yeto-precommit-check
        name: yeto size / secret / e-mail check
        entry: python3 scripts/precommit_check.py
        language: system
        pass_filenames: true
      - id: yeto-commit-message-english
        name: commit message must be English (no CJK)
        entry: python3 scripts/check_commit_message.py
        language: system
        stages: [commit-msg]
