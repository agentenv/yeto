name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to a pull request cancels the run of its older head (a full python
# run takes about 50 minutes). On main every commit runs to the end.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: syncer
      - run: cargo test --manifest-path syncer/Cargo.toml

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # Full history: some tests compare against older commits via git show/archive.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Repository hygiene (size, secrets, e-mail, private IPs, home paths)
        run: git ls-files -z | xargs -0 python scripts/precommit_check.py
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: syncer
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # Same install as docs/TESTING.md (CPU torch + the `test` extra).
      - name: Install CPU torch and deps
        run: |
          uv pip install --system --index-strategy unsafe-best-match \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            "torch==2.8.0+cpu" -r pyproject.toml --extra test
      # Tokenizer/config files (no weights) of the repos in tests/hf_assets.py:
      # fetched once per repo-list hash, then the tests run offline.
      - name: HF test assets cache key
        id: hf-key
        run: echo "key=$(python scripts/prefetch_hf_test_assets.py --cache-key)" >> "$GITHUB_OUTPUT"
      # restore + save (not actions/cache): the cache is saved right after the
      # prefetch, so a failing test run does not refetch the hub next time.
      - uses: actions/cache/restore@v4
        id: hf-cache
        with:
          path: ~/.cache/huggingface/hub
          key: hf-test-assets-${{ steps.hf-key.outputs.key }}
      - name: Prefetch HF test assets
        if: steps.hf-cache.outputs.cache-hit != 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/prefetch_hf_test_assets.py
      - uses: actions/cache/save@v4
        if: steps.hf-cache.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/huggingface/hub
          key: hf-test-assets-${{ steps.hf-key.outputs.key }}
      - name: Tests (includes live syncer+learner integration loop)
        env:
          HF_HUB_OFFLINE: "1"
          YETO_REQUIRE_HF_ASSETS: "1"
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: PYTHONPATH=. python -m pytest tests -q -p no:cacheprovider -rfEs --timeout=600 --durations=25


  # Boat/sandbox tests import harbor, which needs Python >= 3.12 and conflicts
  # with the skypilot pin in the `test` extra (uvicorn), so the 3.11 `python`
  # job skips them. This job installs the Harbor build yeto is verified
  # against (docker/harbor-layer/versions.json) and runs only those files.
  harbor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install CPU torch, yeto, dev tools and pinned Harbor
        run: |
          HARBOR_REQ=$(python -c "import json; print(json.load(open('docker/harbor-layer/versions.json'))['harbor']['requirement'])")
          uv pip install --system --index-strategy unsafe-best-match \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            "torch==2.8.0+cpu" -r pyproject.toml --extra dev "$HARBOR_REQ"
      - name: Harbor tests
        run: |
          # Every test file that mentions harbor: some import it only through yeto
          # modules (e.g. yeto.rl.harness.harbor) behind importorskip.
          FILES=$(grep -rl harbor tests --include='test_*.py' | sort)
          python -c "import harbor"
          PYTHONPATH=. python -m pytest $FILES -q -p no:cacheprovider -rfEs --timeout=600
