name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_gpu:
        description: "Also run the gpu job (needs a self-hosted GPU runner)"
        type: boolean
        default: false

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: syncer
      - run: cargo test --manifest-path syncer/Cargo.toml

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # Full history: some tests compare against older commits via git show/archive.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Repository hygiene (size, secrets, e-mail, private IPs, home paths)
        run: git ls-files -z | xargs -0 python scripts/precommit_check.py
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: syncer
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # Same install as docs/TESTING.md (CPU torch + the `test` extra).
      - name: Install CPU torch and deps
        run: |
          uv pip install --system --index-strategy unsafe-best-match \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            "torch==2.8.0+cpu" -r pyproject.toml --extra test
      - name: Tests (includes live syncer+learner integration loop)
        run: PYTHONPATH=. python -m pytest tests -q -p no:cacheprovider -m "not gpu" -rfEs --timeout=600 --durations=25

  # No self-hosted GPU runner is registered; only run when explicitly requested
  # via `gh workflow run ci -f run_gpu=true`.
  gpu:
    if: github.event_name == 'workflow_dispatch' && inputs.run_gpu
    runs-on: [self-hosted, gpu]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Ensure CI venv (persisted outside the workspace; checkout cleans the tree)
        run: |
          VENV="$HOME/.cache/yeto-ci-venv"
          if [ ! -x "$VENV/bin/python" ]; then
            python3 -m venv "$VENV"
            "$VENV/bin/pip" install --upgrade pip
          fi
          "$VENV/bin/pip" install --quiet torch pytest pytest-timeout transformers==4.57.1 datasets peft cloudpickle
          echo "$VENV/bin" >> "$GITHUB_PATH"
      - name: GPU smoke test (SmolLM2-135M, real syncer + real learners on CUDA)
        run: python -m pytest tests/test_gpu_smollm.py -q
