[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yeto"
version = "0.1.0"
description = "Efficient, low-cost post-training across clouds and regions"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    # <2.9: cu13x wheels need driver >=580; cloud AMIs ship 535 (CUDA 12.2).
    "torch>=2.4,<2.9",
    "transformers==5.13.0",  # keep in lockstep with requirements.txt
    "datasets>=3.0",
    "peft>=0.14",
    "accelerate>=1.0",
    "sentencepiece",
    "protobuf",
    "cloudpickle",
    "huggingface-hub>=0.34",
    "safetensors>=0.4",
    # Delta release format v2 compresses with zstd; Python >= 3.14 ships it
    # in the standard library (compression.zstd).
    "zstandard>=0.22; python_version < '3.14'",
]

[project.optional-dependencies]
# Every cloud `yeto shape` / `yeto launch` can plan or provision through
# sky; Modal is not a sky cloud and rides the `modal` extra below.
# <0.15: yeto.sky_patches is verified per sky version and skips a version it does not know
launcher = ["skypilot[aws,runpod,nebius,verda]>=0.14.3,<0.15"]
modal = ["modal>=1.0"]
# Apple-silicon island backend (yeto.mlx.learner); torch stays required —
# the wire/data path is shared with the CUDA learners.
mlx = ["mlx>=0.31", "mlx-lm>=0.29"]
qlora = ["bitsandbytes>=0.46.1"]
# Harbor AgentENV sandbox provider (yeto.rl.harness.harbor.agentenv_*): the E2B
# Python SDK drives the E2B-compatible AgentENV control plane. e2b>=2.12 needs
# python>=3.10 and carries native fork/pause/resume (developed against 2.64.0).
agentenv = ["e2b>=2.12"]
local-rl = ["gymnasium>=0.29.0", "requests>=2.31.0", "numpy>=1.24"]
diffusion = ["diffusers>=0.35", "pillow", "imageio[ffmpeg]", "yeto[qlora]"]
diffusion-protenix = ["protenix; python_version >= '3.11'"]
a100-liger = ["liger-kernel==0.8.0", "peft==0.19.1"]
a100-flash-attn = ["flash-attn==2.8.3"]
wandb = ["wandb>=0.18"]
dev = ["pytest", "pytest-timeout", "pytest-asyncio"]
# Local safe test suite (docs/TESTING.md): the dev tools plus the optional
# packages the unit tests import. peft follows the exact version the
# a100-liger lane requires (yeto/kernel_deps.py), so both extras co-install.
test = [
    "yeto[dev]",
    "skypilot[aws,runpod,nebius,verda]==0.14.3",
    "boto3==1.43.104",
    "peft==0.19.1",
    "accelerate==1.15.0",
    "pylatexenc==2.10",  # vendored Miles math grader (test_rl_neutral_rewards)
    "pillow",  # diffusion tests
]

[project.scripts]
yeto = "yeto.cli:main"
yeto-export = "yeto.export:main"
yeto-codex-traces = "yeto.codex_traces:main"
yeto-wandb-tape = "yeto.wandb_tape:main"
yeto-diffusion-export = "yeto.diffusion.export:main"
yeto-diffusion-sample = "yeto.diffusion.sample:main"
yeto-rl-export = "yeto.rl.export:main"
yeto-rl-ssh = "yeto.rl.ssh_harness:main"
yeto-stage1 = "yeto.rl.stage1:main"
yeto-protenix-export-batch = "yeto.diffusion.protenix_export:main"
yeto-hunyuan3d-export-batch = "yeto.diffusion.hunyuan3d_export:main"

[tool.setuptools.packages.find]
include = ["yeto*"]

[tool.setuptools.package-data]
"yeto.dashboard" = ["*.json", "static/*"]
"yeto.cloud" = ["*.json"]
"yeto.cost" = ["*.json"]
"yeto.launch.nc" = ["*.mjs"]
"yeto.rl.adapters.miles" = ["*.json", "overlays/*.patch"]
