name: exp2-23-qwen9b-vanilla-sync

resources:
  use_spot: true
  disk_size: 512
  any_of:
    - infra: aws/us-west-2
      instance_type: g6.12xlarge
    - infra: aws/us-west-2
      instance_type: g5.12xlarge
    - infra: aws/us-west-2
      instance_type: g6e.12xlarge

file_mounts:
  ~/.aws: ~/.aws
  ~/sky_workdir/experiment-results/EXP2/anchor_capybara_11000_256.jsonl: /Users/shou/yeto/experiment-results/EXP2/qwen9b-action-probe/anchor_capybara_11000_256.jsonl
  ~/sky_workdir/experiment-results/EXP2/anchor_capybara_11000_256_manifest.json: /Users/shou/yeto/experiment-results/EXP2/qwen9b-action-probe/anchor_capybara_11000_256_manifest.json
  ~/sky_workdir/experiment-results/EXP2/eval_capybara_12000_512.jsonl: /Users/shou/yeto/experiment-results/EXP2/qwen9b-action-probe/eval_capybara_12000_512.jsonl
  ~/sky_workdir/experiment-results/EXP2/eval_capybara_12000_512_manifest.json: /Users/shou/yeto/experiment-results/EXP2/qwen9b-action-probe/eval_capybara_12000_512_manifest.json

workdir: .

setup: |
  set -euxo pipefail
  if ! command -v cargo >/dev/null 2>&1; then
    curl https://sh.rustup.rs -sSf | sh -s -- -y
  fi
  . "$HOME/.cargo/env" || true
  python -m pip install -U pip
  python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cu121
  python -m pip install -r requirements.txt awscli
  python -m pip install -e . --no-deps
  if command -v nvidia-smi >/dev/null 2>&1; then
    nvidia-smi
    sudo modprobe nvidia_uvm || true
    if ! systemctl list-unit-files | grep -q '^nvidia-fabricmanager'; then
      sudo apt-get update
      sudo apt-get install -y nvidia-fabricmanager-535 || \
        sudo apt-get install -y cuda-drivers-fabricmanager-535 || \
        sudo apt-get install -y nvidia-fabricmanager || true
    fi
    sudo systemctl enable nvidia-fabricmanager || true
    sudo systemctl restart nvidia-fabricmanager || sudo service nvidia-fabricmanager restart || true
    for i in $(seq 1 36); do
      if python -c 'import torch; print("cuda_available", torch.cuda.is_available()); print("device_count", torch.cuda.device_count()); assert torch.cuda.is_available() and torch.cuda.device_count() > 0; print("capability", torch.cuda.get_device_capability(0))'
      then
        break
      fi
      if [ "$i" -eq 36 ]; then
        echo "[yeto-setup] CUDA did not initialize after Fabric Manager restart" >&2
        nvidia-smi || true
        systemctl status nvidia-fabricmanager --no-pager || true
        exit 1
      fi
      sleep 5
      sudo systemctl restart nvidia-fabricmanager || sudo service nvidia-fabricmanager restart || true
    done
  fi
  cargo build --release -q --manifest-path syncer/Cargo.toml

run: |
  set -euxo pipefail
  . "$HOME/.cargo/env" || true
  export PYTHONUNBUFFERED=1
  export TOKENIZERS_PARALLELISM=false
  export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
  NGPU=$(nvidia-smi -L | wc -l)
  EXP_ROOT="experiment-results/EXP2/vanilla-sync-seed223"
  S3_BASE="s3://yeto-exp-artifacts-533462777468-us-west-2/probecommit-resume-20260710/vanilla-sync-seed223"
  mkdir -p "$EXP_ROOT"
  git rev-parse HEAD > "$EXP_ROOT/git_commit.txt" || true

  # Restore any partial results from a prior preempted attempt; wipe arms
  # and replay shards that did not finish so they rerun cleanly.
  aws s3 sync "$S3_BASE/" "$EXP_ROOT/" --quiet || true
  for label in sync-sgd028 sync-mu09-lr175; do
    if [ ! -f "$EXP_ROOT/$label/report/results.jsonl" ]; then
      rm -rf "$EXP_ROOT/$label"
    fi
  done
  for shard in "$EXP_ROOT"/exact-lr-replay/sync-sgd028/shard*; do
    if [ -d "$shard" ] && [ ! -f "$shard/summary.json" ]; then rm -rf "$shard"; fi
  done
  (while true; do sleep 300; aws s3 sync "$EXP_ROOT" "$S3_BASE/" --delete --quiet || true; done) &
  SYNC_PID=$!
  trap 'kill $SYNC_PID 2>/dev/null || true' EXIT

  run_arm () {
    local label=$1 lr=$2 mu=$3
    if [ -f "$EXP_ROOT/$label/report/results.jsonl" ]; then
      echo "[exp2-23] arm $label already complete, skipping"
      return 0
    fi
    python scripts/compare_diloco.py \
      --model qwen35-9b \
      --data trl-lib/Capybara \
      --settings m4 \
      --baseline-loss 0.0 \
      --delta-correction none \
      --outer-optimizer nesterov \
      --outer-lr "$lr" \
      --outer-momentum "$mu" \
      --token-budget 700000 \
      --seq-len 128 \
      --micro-batch-size 1 \
      --inner-lr 0.001 \
      --lora-r 2 \
      --lora-alpha 4 \
      --eval-rows 64 \
      --max-rows 5000 \
      --shuffle-rows-seed 223 \
      --training-seed 223223 \
      --device cuda \
      --gpu-slots "$NGPU" \
      --fixed-window-tokens 8192 \
      --fixed-window-microsteps 64 \
      --pad-to-fixed-window-tokens \
      --freeze-delta-before-delay \
      --learner-push-delay-ms 0,0,0,0 \
      --learner-delay-jitter-ms 0 \
      --syncer-total-steps 80 \
      --learner-max-steps 2500 \
      --strict-quorum \
      --syncer-probe-capture \
      --syncer-probe-capture-every 1 \
      --work-dir "$EXP_ROOT/$label/work" \
      --report-dir "$EXP_ROOT/$label/report"
  }

  # Arm A: synchronous counterpart of the async final-SGD baseline
  # (qwen9b-locked-noheloco-sgd-lr028-seed223-700k). Only the delay
  # pattern changes: 0/800/1600/2400 -> 0/0/0/0, jitter 50 -> 0.
  run_arm sync-sgd028 0.28 0

  # Arm B: vanilla-DiLoCo outer optimizer (Nesterov mu=0.9) at the tuned
  # LR 0.175, same zero-delay schedule.
  run_arm sync-mu09-lr175 0.175 0.9

  # Event-tape geometry diagnostics for both arms.
  TAPE_A=$(find "$EXP_ROOT/sync-sgd028/work" -name '*tape*.jsonl' | head -1)
  TAPE_B=$(find "$EXP_ROOT/sync-mu09-lr175/work" -name '*tape*.jsonl' | head -1)
  python scripts/summarize_outer_step_diagnostics.py \
    --run sync-sgd028 "$TAPE_A" \
    --run sync-mu09-lr175 "$TAPE_B" \
    --out-json "$EXP_ROOT/step_diagnostics.json" \
    --out-md "$EXP_ROOT/step_diagnostics.md"

  # Exact-LR replay on the SGD arm only (the replay is exact only for
  # memoryless SGD). Same grid, anchor, oracle, and selector as EXP2.21
  # so negative-merge rate and scalar headroom are directly comparable
  # to the async seed-223 capture.
  REPLAY_ROOT="$EXP_ROOT/exact-lr-replay/sync-sgd028"
  mkdir -p "$REPLAY_ROOT"
  pids=()
  for shard in $(seq 0 $((NGPU - 1))); do
    if [ -f "$REPLAY_ROOT/shard$shard/summary.json" ]; then
      echo "[exp2-23] replay shard $shard already complete, skipping"
      continue
    fi
    CUDA_VISIBLE_DEVICES=$shard HF_HUB_OFFLINE=1 \
    python scripts/replay_exact_lr_probe.py \
      --capture-dir "$EXP_ROOT/sync-sgd028/work/m4/syncer_probe" \
      --model qwen35-9b \
      --anchor-data experiment-results/EXP2/anchor_capybara_11000_256.jsonl \
      --oracle-data experiment-results/EXP2/eval_capybara_12000_512.jsonl \
      --seq-len 128 \
      --lora-r 2 \
      --lora-alpha 4 \
      --fragments 4 \
      --anchor-panels 8 \
      --oracle-panels 8 \
      --anchor-blocks-per-panel 2 \
      --oracle-blocks-per-panel 2 \
      --multipliers 0.5,0.75,0.875,1.0,1.125,1.25,1.5 \
      --outer-lr 0.28 \
      --min-gain 0.00025 \
      --lcb-z 2.365 \
      --min-win-rate 0.75 \
      --expected-candidates 4 \
      --group-start "$shard" \
      --group-stride "$NGPU" \
      --seed 223 \
      --device cuda \
      --out-jsonl "$REPLAY_ROOT/shard$shard/replay.jsonl" \
      --out-summary "$REPLAY_ROOT/shard$shard/summary.json" &
    pids+=($!)
  done
  for pid in "${pids[@]}"; do wait "$pid"; done

  python scripts/aggregate_exact_lr_probe.py \
    --replays \
      "$REPLAY_ROOT"/shard0/replay.jsonl \
      "$REPLAY_ROOT"/shard1/replay.jsonl \
      "$REPLAY_ROOT"/shard2/replay.jsonl \
      "$REPLAY_ROOT"/shard3/replay.jsonl \
      "$REPLAY_ROOT"/shard4/replay.jsonl \
      "$REPLAY_ROOT"/shard5/replay.jsonl \
      "$REPLAY_ROOT"/shard6/replay.jsonl \
      "$REPLAY_ROOT"/shard7/replay.jsonl \
    --expected-seeds 223 \
    --expected-groups-per-seed 80 \
    --out-json "$EXP_ROOT/exact-lr-replay/aggregate.json" \
    --out-md "$EXP_ROOT/exact-lr-replay/aggregate.md"

  # Archive: full tree minus bulky capture tensors, plus a complete tar
  # of the captures so the momentum-arm tape can be replayed later.
  aws s3 sync "$EXP_ROOT" "$S3_BASE/" --exclude "*/syncer_probe/*"
  tar -czf /tmp/exp2_23_vanilla_sync_captures.tgz \
    "$EXP_ROOT/sync-sgd028/work/m4/syncer_probe" \
    "$EXP_ROOT/sync-mu09-lr175/work/m4/syncer_probe"
  aws s3 cp /tmp/exp2_23_vanilla_sync_captures.tgz "$S3_BASE/captures.tgz"
  echo "[exp2-23] complete"
