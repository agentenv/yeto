            - text: •
            - paragraph [ref=f12e92]: We propose Zeno++, a new approach for Byzantine-tolerant fully asynchronous SGD with anonymous workers, and low overhead of the additional computation for the validation on the servers.
          - listitem [ref=f12e93]:
            - text: •
            - paragraph [ref=f12e95]: We show that Zeno++ tolerates Byzantine workers without any limit on either the staleness or the number of Byzantine workers.
          - listitem [ref=f12e96]:
