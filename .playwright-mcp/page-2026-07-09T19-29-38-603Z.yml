          - link "2018" [ref=f12e51] [cursor=pointer]:
            - /url: "#bib.bib6"
          - text: )
        - text: . Unlike previous work, we consider Byzantine tolerance with minimal assumptions—an unbounded number of Byzantine workers, and full asynchrony with unbounded delay.
      - generic [ref=f12e52]:
        - paragraph [ref=f12e53]: "Byzantine tolerance of asynchronous SGD is challenging due to several reasons:"
        - list [ref=f12e54]:
          - listitem [ref=f12e55]:
            - text: •
            - paragraph [ref=f12e57]: Full asynchrony. Lack of synchrony introduces additional noise into the stochastic gradients. This makes it more difficult to distinguish gradients sent by Byzantine workers from gradients sent by benign ones, especially as Byzantine behavior may exacerbate staleness.
          - listitem [ref=f12e58]:
            - text: •
            - paragraph [ref=f12e60]: Unpredictable successive updates. The lack of synchronous scheduling means “fast” workers may send updates, to the server, more frequently than “slower” workers. Byzantine workers may exploit this by suffocating the server with their wrong gradients.
          - listitem [ref=f12e61]:
            - text: •
            - paragraph [ref=f12e63]:
