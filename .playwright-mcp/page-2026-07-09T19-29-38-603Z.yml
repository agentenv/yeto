      - paragraph [ref=f12e47]:
        - text: Byzantine failures have been well-studied for classical distributed systems, especially for consensus
        - generic [ref=f12e48]:
          - text: (Lamport et al.,
          - link "1982" [ref=f12e49] [cursor=pointer]:
            - /url: "#bib.bib11"
          - text: )
        - text: . These results include well-known bounds on how many Byzantine workers can be tolerated. Yet, in distributed machine learning, Byzantine failures have a different impact than in classical consensus
