  - article [ref=f12e4]:
    - 'heading "Zeno++: Robust Fully Asynchronous SGD" [level=1] [ref=f12e5]'
    - generic [ref=f12e6]:
      - generic [ref=f12e7]: Cong Xie
      - generic [ref=f12e9]: Oluwasanmi Koyejo
      - generic [ref=f12e11]: Indranil Gupta
    - generic [ref=f12e13]:
      - heading "Abstract" [level=6] [ref=f12e14]
      - paragraph [ref=f12e15]: We propose Zeno++, a new robust asynchronous Stochastic Gradient Descent (SGD) procedure, intended to tolerate Byzantine failures of workers. In contrast to previous work, Zeno++ removes several unrealistic restrictions on worker-server communication, now allowing for fully asynchronous updates from anonymous workers, for arbitrarily stale worker updates, and for the possibility of an unbounded number of Byzantine workers. The key idea is to estimate the descent of the loss value after the candidate gradient is applied, where large descent values indicate that the update results in optimization progress. We prove the convergence of Zeno++ for non-convex problems under Byzantine failures. Experimental results show that Zeno++ outperforms existing Byzantine-tolerant asynchronous SGD algorithms.
    - generic [ref=f12e16]: SGD, robust
    - generic [ref=f12e17]:
      - heading "1 Introduction" [level=2] [ref=f12e18]:
        - generic [ref=f12e19]: "1"
        - text: Introduction
      - paragraph [ref=f12e21]:
        - text: Synchronous training and asynchronous training are the two most common paradigms of distributed machine learning. On the one hand, synchronous training requires the global updates at the server to be blocked until all the workers respond (after each period). In contrast, for asynchronous training, the server can update the global model immediately after each worker’s response. Theoretical and experimental analysis
        - generic [ref=f12e22]:
          - text: (Dutta et al.,
          - link "2018" [ref=f12e23] [cursor=pointer]:
            - /url: "#bib.bib7"
          - text: )
        - text: suggests that synchronous training is more stable and has lower noise, but is slower due to the global barrier across all the workers (after each period). Since asynchronous training is comparatively faster especially for heterogeneous systems with stragglers, in this paper, we focus on asynchronous training. Doing so requires us to tackle challenges including instability and noisiness that arise from asynchony.
      - paragraph [ref=f12e25]:
        - text: Concretely, we study the security of distributed asynchronous
        - generic [ref=f12e26]: S
        - text: tochastic
        - generic [ref=f12e27]: G
        - text: radient
        - generic [ref=f12e28]: D
        - text: escent (SGD) in a centralized worker-server architecture, also known as the
        - generic [ref=f12e29]: P
        - text: arameter
        - generic [ref=f12e30]: S
        - text: erver (or PS) architecture. In the PS architecture, there are server nodes and worker nodes. Each worker pulls the global model from the servers, estimates the gradients using the local portion of the training data, then sends the gradient estimates to the servers. The servers update the model asynchronously, as soon as a new gradient is received from any worker.
