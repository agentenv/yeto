      - paragraph [ref=f12e83]:
        - text: We propose Zeno++, a new algorithm that validates the gradients with low computation overhead on the server via lazy updates. Our key idea is to estimate the descent of the loss value after the candidate gradient is applied to the model parameters–for the latter we leverage the Byzantine-tolerant synchronous SGD algorithm called Zeno
        - generic [ref=f12e84]:
          - text: (Xie et al.,
          - link "2019b" [ref=f12e85] [cursor=pointer]:
            - /url: "#bib.bib20"
          - text: )
        - text: . Intuitively, if the loss value decreases, the candidate gradient is likely to result in optimization progress. We also propose a mechanism of lazy updates to reduce the computation overhead.
      - generic [ref=f12e86]:
