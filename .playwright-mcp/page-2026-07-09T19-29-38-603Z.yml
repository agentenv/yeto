          - text: ","
          - math [ref=f12e3679]:
            - generic [ref=f12e3681]:
              - generic [ref=f12e3682]: k
              - generic [ref=f12e3683]: =
              - generic [ref=f12e3684]:
                - generic [ref=f12e3685]: k
                - generic [ref=f12e3686]: w
              - generic [ref=f12e3687]: =
              - generic [ref=f12e3688]: "10"
          - text: ","
          - math [ref=f12e3689]:
            - generic [ref=f12e3691]:
              - generic [ref=f12e3692]: ρ
              - generic [ref=f12e3693]: =
              - generic [ref=f12e3694]: "10"
          - text: ","
          - math [ref=f12e3695]:
            - generic [ref=f12e3697]:
              - generic [ref=f12e3698]: ϵ
              - generic [ref=f12e3699]: =
              - generic [ref=f12e3700]: "2"
          - text: . Each experiment runs 40 epochs, where each epoch is a full pass of the training data. The other basic settings are the same as the experiments on CIFAR-10.
        - paragraph [ref=f12e3702]: We use the perplexity (the exponential of the loss value) on the testing set as the evaluation metric. We also report the false positive rate (FP), which is the ratio of correct gradients that are recognized as Byzantine and filtered out by Zeno++ or the Kardam baseline.
        - generic [ref=f12e3703]:
          - heading "6.3.1 Empirical Results" [level=4] [ref=f12e3704]:
            - generic [ref=f12e3705]: 6.3.1
            - text: Empirical Results
          - paragraph [ref=f12e3707]:
            - text: In Figure
            - link "4" [ref=f12e3708] [cursor=pointer]:
              - /url: "#S6.F4"
            - text: ", we test the Byzantine-tolerance to the “sign-flipping” attack, on LSTM-based language models and WikiText-2 dataset. It is shown that when there are no Byzantine workers, Zeno++ converges as fast as vanilla asynchronous SGD. When there are Byzantine workers, Zeno++ converges slightly slower than AsyncSGD without attacks, and much faster than Kardam. When the number of Byzantine workers gets larger, the convergence of Zeno++ gets slower. In overall, on the language models, Zeno++ achieves performance similar to what we observe for CNN."
        - generic [ref=f12e3709]:
          - heading "6.3.2 Discussion" [level=4] [ref=f12e3710]:
            - generic [ref=f12e3711]: 6.3.2
            - text: Discussion
          - paragraph [ref=f12e3713]:
            - text: We show that Zeno++ can protect asynchronous SGD from Byzantine failures on the workers in multiple applications, including image classification and language models. Compared to CIFAR-10, with smaller
            - math [ref=f12e3714]:
              - generic [ref=f12e3716]:
                - generic [ref=f12e3717]: k
                - generic [ref=f12e3718]: w
            - text: and
            - math [ref=f12e3719]:
              - generic [ref=f12e3720]: q
            - text: for WikiText-2, the FP of Zeno++ can be as low as
            - math [ref=f12e3722]:
              - generic [ref=f12e3724]:
                - generic [ref=f12e3725]: "10"
                - generic [ref=f12e3726]: "%"
            - text: . Note that the choices of
            - math [ref=f12e3727]:
              - generic [ref=f12e3728]: ρ
            - text: and
            - math [ref=f12e3730]:
              - generic [ref=f12e3731]: ϵ
            - text: depends on the learning rate
            - math [ref=f12e3733]:
              - generic [ref=f12e3734]: γ
            - text: . Large
            - math [ref=f12e3736]:
              - generic [ref=f12e3737]: γ
            - text: requires large
            - math [ref=f12e3739]:
              - generic [ref=f12e3740]: ρ
            - text: and
            - math [ref=f12e3742]:
              - generic [ref=f12e3743]: ϵ
            - text: . Kardam still performs badly due to the large false positive rates.
    - generic [ref=f12e3745]:
      - heading "7 Conclusion" [level=2] [ref=f12e3746]:
        - generic [ref=f12e3747]: "7"
        - text: Conclusion
      - paragraph [ref=f12e3749]: "We propose a novel Byzantine-tolerant fully asynchronous SGD algorithm: Zeno++. Zeno++ provably converges. Our empirical results show good performance compared to previous work. In future work, we will explore variations of our approach for other settings such as federated learning."
