          - generic [ref=f12e132]:
            - text: Damaskinos et al. (
            - link "2018" [ref=f12e133] [cursor=pointer]:
              - /url: "#bib.bib6"
            - text: )
          - text: "proposed Kardam, which to our knowledge is the only prior work to address Byzantine-tolerant asynchronous training. Kardam utilizes the Lipschitzness of the gradients to filter out outliers. However, Kardam assumes a threat model much weaker than ours. The major differences in the threat model are listed as follows:"
        - list [ref=f12e134]:
          - listitem [ref=f12e135]:
            - text: •
            - paragraph [ref=f12e137]: Verification of worker identity. Unlike Kardam, we do not require verifying the identities of the workers when the server receives gradients. Kardam uses the so-called empirical Lipschitz coefficient, to test the benignity of the gradient sent by a specific worker. Such a mechanism keeps the record of the empirical Lipschitz coefficient of each worker. Thus, whenever a gradient is received, the Kardam server must be able to identify the identity/index of the worker. However, since Byzantine workers can behave arbitrarily, they can fake their identities/indices when sending gradients to the servers. Thus, Kardam assumes a threat model much weaker than the traditional Byzantine failure/threat model. Note that for synchronous training, the server can partially counter the index spoofing attack by simply filtering out all the gradients with duplicated indices. However, such an approach is infeasible for asynchronous training.
          - listitem [ref=f12e138]:
            - text: •
            - paragraph [ref=f12e140]:
              - text: Bounded staleness of workers/limit of successive gradients. Unlike Kardam, we do not require bounded staleness of the workers. Kardam requires that the number of gradients successively received from a single worker is bounded above. To be more specific, on the server, any sequence of successively received gradients of length
              - math [ref=f12e141]:
                - generic [ref=f12e143]:
                  - generic [ref=f12e144]:
                    - generic [ref=f12e145]: "2"
                    - generic [ref=f12e146]: q
                  - generic [ref=f12e147]: +
                  - generic [ref=f12e148]: "1"
              - text: must contain at least
              - math [ref=f12e149]:
                - generic [ref=f12e151]:
                  - generic [ref=f12e152]: q
                  - generic [ref=f12e153]: +
                  - generic [ref=f12e154]: "1"
              - text: gradients from honest workers. However, in real-world asynchronous training, such an assumption is very difficult to satisfy.
          - listitem [ref=f12e155]:
            - text: •
            - paragraph [ref=f12e157]: A majority of honest workers. Unlike Kardam, we do not require a majority of honest workers. Kardam requires that the number of Byzantine workers is less than one-third of the total number of workers – much stronger restriction than the standard setting that allows for the number of Byzantine workers to be up to 50% of the total number of workers. Zeno++ further extends this guarantee to allow for not only 50%, but also a majority of Byzantine workers.
