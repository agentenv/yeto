        - generic [ref=f12e3588]:
          - heading "6.2.2 Discussion" [level=4] [ref=f12e3589]:
            - generic [ref=f12e3590]: 6.2.2
            - text: Discussion
          - paragraph [ref=f12e3592]:
            - text: Kardam performs surprisingly badly in our experiments. The experiments in
            - generic [ref=f12e3593]:
              - text: (Damaskinos et al.,
              - link "2018" [ref=f12e3594] [cursor=pointer]:
                - /url: "#bib.bib6"
              - text: )
            - text: focus on dampening staleness when there are no Byzantine failures. For Byzantine tolerance,
            - generic [ref=f12e3595]:
              - text: Damaskinos et al. (
              - link "2018" [ref=f12e3596] [cursor=pointer]:
                - /url: "#bib.bib6"
              - text: )
            - text: only reports that Kardam filters out 100% of the Byzantine gradients, which matches the results in our experiments. However, we observe that in addition to filtering out 100% of the Byzantine gradients, Kardam also filters nearly 100% of the correct gradients. In Figure
            - link "2" [ref=f12e3597] [cursor=pointer]:
              - /url: "#S6.F2"
            - text: ", we report that the false positive rate of Kardam is nearly 99%, which makes the convergence extremely slow. To make things worse, Kardam does not even perform as good as Server-only. For these reasons, we discourage the use of Kardam for distributed training. One reason why Kardam performs badly is that we use a more general threat model in this paper, which does not guarantee an important assumption of Kardam, namely “any sequence of successively received gradients of length"
            - math [ref=f12e3598]:
              - generic [ref=f12e3600]:
                - generic [ref=f12e3601]:
                  - generic [ref=f12e3602]: "2"
                  - generic [ref=f12e3603]: q
                - generic [ref=f12e3604]: +
                - generic [ref=f12e3605]: "1"
            - text: must contain at least
            - math [ref=f12e3606]:
              - generic [ref=f12e3608]:
                - generic [ref=f12e3609]: q
                - generic [ref=f12e3610]: +
                - generic [ref=f12e3611]: "1"
            - text: gradients from honest workers”. It is clear that this assumption is quite strong, as in an asynchronous setting, Byzantine workers can easily send long sequences of erroneous responses. Our approach does not depend on such a strong assumption.
          - paragraph [ref=f12e3613]:
            - text: In all the experiments, Zeno++ converges faster than the baselines when there are Byzantine failures. Although the convergence of Zeno++ is slower than AsyncSGD when there are no attacks, we find that it provides a reasonable trade-off between security and convergence speed. In general, larger worker delay
            - math [ref=f12e3614]:
              - generic [ref=f12e3616]:
                - generic [ref=f12e3617]: k
                - generic [ref=f12e3618]: w
            - text: and more Byzantine workers
            - math [ref=f12e3619]:
              - generic [ref=f12e3620]: q
            - text: add more error and noise to the gradients, which slows down the convergence, because there are fewer valid gradients for the server to use. Zeno++ can filter out most of the harmful gradients at the cost of
            - math [ref=f12e3622]:
              - generic [ref=f12e3624]:
                - generic [ref=f12e3625]: FP
                - generic [ref=f12e3626]: ≈
                - generic [ref=f12e3627]:
                  - generic [ref=f12e3628]: "50"
                  - generic [ref=f12e3629]: "%"
            - text: .
          - paragraph [ref=f12e3631]:
            - text: Note that Server-only is an extreme case that only uses the server and the validation dataset to train the model in a non-distributed manner, which will not be affected by Byzantine workers. However, only using the validation data is not enough for training, as shown in Figure
            - link "1" [ref=f12e3632] [cursor=pointer]:
              - /url: "#S6.F1"
            - text: . Similarly in practice, we can use a small dataset separated from the training data for cross-validation, but will never directly train the model only on such validation dataset. Furthermore, as shown in Figure
            - link "2" [ref=f12e3633] [cursor=pointer]:
              - /url: "#S6.F2"
            - text: ", Zeno++ performs much better than Server-only. Thus, we can draw the conclusion that Zeno++ is efficiently training the model on the honest workers in a distributed manner, which is not equivalent to training on the validation dataset only."
          - paragraph [ref=f12e3635]:
            - text: On average, the server computes
            - math [ref=f12e3636]:
              - generic [ref=f12e3638]:
                - generic [ref=f12e3639]:
                  - generic [ref=f12e3640]:
                    - generic [ref=f12e3641]: "n"
                    - generic [ref=f12e3642]: s
                  - generic [ref=f12e3643]: k
                - generic [ref=f12e3644]: =
                - generic [ref=f12e3645]: "12.8"
            - text: gradients in each iteration, since the validation gradient
            - math [ref=f12e3646]:
              - generic [ref=f12e3647]: v
            - text: of Zeno++ is updated after every
            - math [ref=f12e3649]:
              - generic [ref=f12e3651]:
                - generic [ref=f12e3652]: k
                - generic [ref=f12e3653]: =
                - generic [ref=f12e3654]: "10"
            - text: iterations. Thus, the workload on the server is much smaller than a worker. Furthermore, since we can parallelize the workload on the server and workers, the computation overhead of
            - math [ref=f12e3655]:
              - generic [ref=f12e3656]: v
            - text: can be hidden, so that Zeno++ can benefit from distributed training.
      - generic [ref=f12e3658]:
        - heading "6.3 WikiText-2" [level=3] [ref=f12e3659]:
          - generic [ref=f12e3660]: "6.3"
          - text: WikiText-2
        - paragraph [ref=f12e3662]:
          - text: The WikiText-2 dataset contains over 2 million tokens from Wikipedia articles, and annotations from Wikidata. We train a LSTM-based language model with one LSTM layer, and one dense layer. The dimension of the hidden state is 200. The back propagation through time (BPTT) is 35. In all the experiments, we take the learning rate
