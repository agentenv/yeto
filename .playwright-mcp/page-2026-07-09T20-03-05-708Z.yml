          - heading "Robust Aggregation for Federated Learning" [level=1] [ref=f127e32]
          - generic [ref=f127e33]:
            - link "Krishna Pillutla" [ref=f127e34] [cursor=pointer]:
              - /url: https://arxiv.org/search/stat?searchtype=author&query=Pillutla,+K
