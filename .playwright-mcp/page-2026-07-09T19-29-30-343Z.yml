          - text: ", Mean seems to have good performance, while it is not supposed to be fault-tolerant. The reason is that both label-flipping and bit-flipping failures do not change the magnitude of the gradients. When the number of faulty gradients"
          - math [ref=f11e3517]:
            - generic [ref=f11e3518]: q
          - text: is less than half, it is possible that the faulty gradients are cancelled out by the non-faulty ones. However, when the magnitude is enlarged, Mean will fail, as pointed out in
          - generic [ref=f11e3520]:
            - text: Xie et al. (
            - link "2018" [ref=f11e3521] [cursor=pointer]:
              - /url: "#bib.bib13"
            - text: )
          - text: .
        - paragraph [ref=f11e3523]: In general, we find that Zeno is more robust than the current state of the art. When the faulty workers dominate, Zeno is the only aggregator that converges in all experiments. When the correct workers dominate, Median can be an alternative with cheap computation.
        - paragraph [ref=f11e3525]:
          - text: The computational complexity of Zeno depends on the complexity of inference and the Zeno batch size
          - math [ref=f11e3526]:
            - generic [ref=f11e3528]:
              - generic [ref=f11e3529]: "n"
              - generic [ref=f11e3530]: r
          - text: . These additional hyperparameters make direct comparison to standard methods more challenging. If we take the approximation that the computational complexity of inference is linear to the number of parameters, then we can roughly compare the time complexity to the baselines. Compared to Median, Zeno is computationally more expensive by the factor of
          - math [ref=f11e3531]:
            - generic [ref=f11e3533]:
              - generic [ref=f11e3534]:
                - generic [ref=f11e3535]: "n"
                - generic [ref=f11e3536]: r
              - generic [ref=f11e3537]: =
              - generic [ref=f11e3538]: "4"
          - text: . However, compared to Krum, which requires
          - math [ref=f11e3539]:
            - generic [ref=f11e3541]:
              - generic [ref=f11e3542]:
                - generic [ref=f11e3543]:
                  - generic [ref=f11e3544]: "20"
                  - generic [ref=f11e3545]: ×
                  - generic [ref=f11e3546]: "19"
                - generic [ref=f11e3547]: /
                - generic [ref=f11e3548]: "2"
              - generic [ref=f11e3549]: =
              - generic [ref=f11e3550]: "190"
          - text: times of
          - math [ref=f11e3551]:
            - generic [ref=f11e3553]:
              - generic [ref=f11e3554]: 𝒪
              - generic [ref=f11e3555]:
                - generic [ref=f11e3556]: (
                - generic [ref=f11e3557]: d
                - generic [ref=f11e3558]: )
          - text: operators, Zeno only needs
          - math [ref=f11e3559]:
            - generic [ref=f11e3561]:
              - generic [ref=f11e3562]:
                - generic [ref=f11e3563]: "21"
                - generic [ref=f11e3564]: ×
                - generic [ref=f11e3565]: "4"
              - generic [ref=f11e3566]: =
              - generic [ref=f11e3567]: "84"
          - text: times of
          - math [ref=f11e3568]:
            - generic [ref=f11e3570]:
              - generic [ref=f11e3571]: 𝒪
              - generic [ref=f11e3572]:
                - generic [ref=f11e3573]: (
                - generic [ref=f11e3574]: d
                - generic [ref=f11e3575]: )
          - text: operators. Furthermore, since the batch size on the workers is
          - math [ref=f11e3576]:
            - generic [ref=f11e3577]: "100"
          - text: ", the computation required on the server is less than that of one worker, which does not cancel out the computational improvements due to data parallelism. The additional computation is the cost that we have to pay for better robustness."
        - paragraph [ref=f11e3580]:
          - text: Another interesting observation is that, although Krum is the state-of-the-art algorithm, it does not perform as well as expected under our designed failures. The reason is that Krum requires the assumption that
          - math [ref=f11e3581]:
            - generic [ref=f11e3583]:
