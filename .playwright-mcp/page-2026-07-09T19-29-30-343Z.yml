- generic [ref=f11e2]:
  - article [ref=f11e4]:
    - 'heading "Zeno: Distributed Stochastic Gradient Descent with Suspicion-based Fault-tolerance" [level=1] [ref=f11e5]'
    - generic [ref=f11e6]:
      - generic [ref=f11e7]: Cong Xie
      - generic [ref=f11e9]: Oluwasanmi Koyejo
      - generic [ref=f11e11]: Indranil Gupta
    - generic [ref=f11e13]:
      - heading "Abstract" [level=6] [ref=f11e14]
      - paragraph [ref=f11e15]: We present Zeno, a technique to make distributed machine learning, particularly Stochastic Gradient Descent (SGD), tolerant to an arbitrary number of faulty workers. Zeno generalizes previous results that assumed a majority of non-faulty nodes; we need assume only one non-faulty worker. Our key idea is to suspect workers that are potentially defective. Since this is likely to lead to false positives, we use a ranking-based preference mechanism. We prove the convergence of SGD for non-convex problems under these scenarios. Experimental results show that Zeno outperforms existing approaches.
    - generic [ref=f11e16]: Robust, SGD
    - generic [ref=f11e17]:
      - heading "1 Introduction" [level=2] [ref=f11e18]:
        - generic [ref=f11e19]: "1"
        - text: Introduction
      - paragraph [ref=f11e21]:
        - text: In distributed machine learning, one of the hardest problems today is fault-tolerance. Faulty workers may take arbitrary actions or modify their portion of the data and/or models arbitrarily. In addition to adversarial attacks on purpose, it is also common for the workers to have hardware or software failures, such as bit-flipping in the memory or communication media. While fault-tolerance has been studied for distributed machine learning
        - generic [ref=f11e22]:
          - text: (Blanchard et al.,
          - link "2017" [ref=f11e23] [cursor=pointer]:
            - /url: "#bib.bib2"
          - text: ; Chen et al.,
          - link "2017" [ref=f11e24] [cursor=pointer]:
            - /url: "#bib.bib4"
          - text: ; Yin et al.,
          - link "2018" [ref=f11e25] [cursor=pointer]:
            - /url: "#bib.bib15"
          - text: ; Feng et al.,
          - link "2014" [ref=f11e26] [cursor=pointer]:
            - /url: "#bib.bib5"
          - text: ; Su & Vaidya,
          - link "2016a" [ref=f11e27] [cursor=pointer]:
            - /url: "#bib.bib11"
          - text: ","
          - link "b" [ref=f11e28] [cursor=pointer]:
            - /url: "#bib.bib12"
          - text: ; Alistarh et al.,
          - link "2018" [ref=f11e29] [cursor=pointer]:
            - /url: "#bib.bib1"
          - text: )
        - text: ", much of the work on fault-tolerant machine learning makes strong assumptions. For instance, a common assumption is that no more than 50% of the workers are faulty"
        - generic [ref=f11e30]:
          - text: (Blanchard et al.,
          - link "2017" [ref=f11e31] [cursor=pointer]:
            - /url: "#bib.bib2"
          - text: ; Chen et al.,
          - link "2017" [ref=f11e32] [cursor=pointer]:
            - /url: "#bib.bib4"
          - text: ; Yin et al.,
          - link "2018" [ref=f11e33] [cursor=pointer]:
            - /url: "#bib.bib15"
          - text: ; Su & Vaidya,
          - link "2016a" [ref=f11e34] [cursor=pointer]:
            - /url: "#bib.bib11"
          - text: ; Alistarh et al.,
          - link "2018" [ref=f11e35] [cursor=pointer]:
            - /url: "#bib.bib1"
          - text: )
        - text: .
      - paragraph [ref=f11e37]: We present Zeno, a new technique that generalizes the failure model so that we only require at least one non-faulty (good) worker. In particular, faulty gradients may pretend to be good by behaving similar to the correct gradients in variance and magnitude, making them hard to distinguish. It is also possible that in different iterations, different groups of workers are faulty, which means that we can not simply identify workers which are always faulty.
      - 'figure "Figure 1: Parameter Server architecture." [ref=f11e38]':
        - img "Refer to caption" [ref=f11e39]
        - generic [ref=f11e40]:
          - generic [ref=f11e41]: "Figure 1:"
          - text: Parameter Server architecture.
      - paragraph [ref=f11e43]:
        - text: We focus on Stochastic Gradient Descent (SGD), and use the Parameter Server (PS) architecture
        - generic [ref=f11e44]:
          - text: (Li et al.,
          - link "2014a" [ref=f11e45] [cursor=pointer]:
            - /url: "#bib.bib7"
          - text: ","
          - link "b" [ref=f11e46] [cursor=pointer]:
            - /url: "#bib.bib8"
          - text: )
        - text: for distributed SGD. As illustrated in Figure 1, processes are composed of the server nodes and worker nodes. In each SGD iteration, the workers pull the latest model from the servers, estimate the gradients using the locally sampled training data, then push the gradient estimators to the servers. The servers aggregate the gradient estimators, and update the model by using the aggregated gradients.
      - paragraph [ref=f11e48]: Our approach, in a nutshell is the following. We treat each candidate gradient estimator as a suspect. We compute a score using a stochastic zero-order oracle. This ranking indicates how trustworthy the given worker is in that iteration. Then, we take the average over the several candidates with the highest scores. This allows us to tolerate a large number of incorrect gradients. We prove that the convergence is as fast as fault-free SGD. Further, the variance falls as the number of non-faulty workers increases.
      - paragraph [ref=f11e50]: "To the best of our knowledge this paper is the first to theoretically and empirically study cases where a majority of workers are faulty for non-convex problems. In summary, our contributions are:"
      - list [ref=f11e52]:
        - listitem [ref=f11e53]:
          - text: •
          - paragraph [ref=f11e55]: A new approach for SGD with fault-tolerance, that works with an arbitrarily large number of faulty nodes as long as there is at least one non-faulty node.
        - listitem [ref=f11e56]:
          - text: •
          - paragraph [ref=f11e58]: Theoretically, the proposed algorithm converges as fast as distributed synchronous SGD without faulty workers, with the same asymptotic time complexity.
        - listitem [ref=f11e59]:
          - text: •
          - paragraph [ref=f11e61]: Experimental results validating that 1) existing majority-based robust algorithms may fail even when the number of faulty workers is lower than the majority, and 2) Zeno gracefully handles such cases.
        - listitem [ref=f11e62]:
          - text: •
          - paragraph [ref=f11e64]: The effectiveness of Zeno also extends to the case where the workers use disjoint local data to train the model, i.e., the local training data are not identically distributed across different workers. Theoretical and experimental analysis is also provided in this case.
    - generic [ref=f11e65]:
      - heading "2 Related Work" [level=2] [ref=f11e66]:
        - generic [ref=f11e67]: "2"
        - text: Related Work
      - paragraph [ref=f11e69]:
        - text: Many approaches for improving failure tolerance are based on robust statistics. For instance,
        - generic [ref=f11e70]:
          - text: Chen et al. (
          - link "2017" [ref=f11e71] [cursor=pointer]:
            - /url: "#bib.bib4"
          - text: ); Su & Vaidya (
          - link "2016a" [ref=f11e72] [cursor=pointer]:
            - /url: "#bib.bib11"
          - text: ","
          - link "b" [ref=f11e73] [cursor=pointer]:
            - /url: "#bib.bib12"
          - text: )
        - text: use geometric median as the aggregation rule.
        - generic [ref=f11e74]:
          - text: Yin et al. (
          - link "2018" [ref=f11e75] [cursor=pointer]:
            - /url: "#bib.bib15"
          - text: )
        - text: establishes statistical error rates for marginal trimmed mean as the aggregation rule. Similar to these papers, our proposed algorithm also works under Byzantine settings.
      - paragraph [ref=f11e77]:
        - text: There are also robust gradient aggregation rules that are not based on robust statistics. For example,
        - generic [ref=f11e78]:
          - text: Blanchard et al. (
          - link "2017" [ref=f11e79] [cursor=pointer]:
            - /url: "#bib.bib2"
          - text: )
        - text: propose Krum, which select the candidates with minimal local sum of Euclidean distances. DRACO
        - generic [ref=f11e80]:
          - text: (Chen et al.,
          - link "2018" [ref=f11e81] [cursor=pointer]:
            - /url: "#bib.bib3"
          - text: )
        - text: uses coding theory to ensure robustness.
      - paragraph [ref=f11e83]:
        - generic [ref=f11e84]:
          - text: Alistarh et al. (
          - link "2018" [ref=f11e85] [cursor=pointer]:
            - /url: "#bib.bib1"
          - text: )
        - text: proposes a fault-tolerant SGD variant different from the robust aggregation rules. The algorithm utilizes historical information, and achieves the optimal sample complexity.
      - paragraph [ref=f11e87]:
        - text: Despite their differences, the existing majority-based methods for synchronous SGD
        - generic [ref=f11e88]:
          - text: (Blanchard et al.,
          - link "2017" [ref=f11e89] [cursor=pointer]:
            - /url: "#bib.bib2"
          - text: ; Chen et al.,
          - link "2017" [ref=f11e90] [cursor=pointer]:
            - /url: "#bib.bib4"
          - text: ; Yin et al.,
          - link "2018" [ref=f11e91] [cursor=pointer]:
            - /url: "#bib.bib15"
          - text: ; Su & Vaidya,
          - link "2016a" [ref=f11e92] [cursor=pointer]:
            - /url: "#bib.bib11"
          - text: ; Alistarh et al.,
          - link "2018" [ref=f11e93] [cursor=pointer]:
            - /url: "#bib.bib1"
          - text: )
        - text: assume that the non-faulty workers dominate the entire set of workers. Thus, such algorithms can trim the outliers from the candidates. However, in real-world failures or attacks, there are no guarantees that the number of faulty workers can be bounded from above.
