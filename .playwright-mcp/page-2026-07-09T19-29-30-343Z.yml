    - generic [ref=f11e3612]:
      - heading "7 Conclusion" [level=2] [ref=f11e3613]:
        - generic [ref=f11e3614]: "7"
        - text: Conclusion
      - paragraph [ref=f11e3616]: We propose a novel aggregation rule for synchronous SGD, which requires a weak assumption that there is at least one honest worker. The algorithm has provable convergence. Our empirical results show good performance in practice. We will apply the proposed method to asynchronous SGD in future work.
