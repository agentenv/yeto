          - math [ref=f11e3592]:
            - generic [ref=f11e3593]: c
          - text: is a general constant,
          - math [ref=f11e3595]:
            - generic [ref=f11e3596]: σ
          - text: is the maximal variance of the gradients, and
          - math [ref=f11e3598]:
            - generic [ref=f11e3599]: g
          - text: is the gradient. Note that
