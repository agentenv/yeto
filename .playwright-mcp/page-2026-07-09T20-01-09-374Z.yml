          - generic [ref=f77e30]: "[Submitted on 6 Nov 2024]"
          - heading "Adaptive Consensus Gradients Aggregation for Scaled Distributed Training" [level=1] [ref=f77e31]
          - generic [ref=f77e32]:
            - link "Yoni Choukroun" [ref=f77e33] [cursor=pointer]:
              - /url: https://arxiv.org/search/cs?searchtype=author&query=Choukroun,+Y
            - text: ","
            - link "Shlomi Azoulay" [ref=f77e34] [cursor=pointer]:
              - /url: https://arxiv.org/search/cs?searchtype=author&query=Azoulay,+S
            - text: ","
            - link "Pavel Kisilev" [ref=f77e35] [cursor=pointer]:
              - /url: https://arxiv.org/search/cs?searchtype=author&query=Kisilev,+P
          - blockquote [ref=f77e36]: Distributed machine learning has recently become a critical paradigm for training large models on vast datasets. We examine the stochastic optimization problem for deep learning within synchronous parallel computing environments under communication constraints. While averaging distributed gradients is the most widely used method for gradient estimation, whether this is the optimal strategy remains an open question. In this work, we analyze the distributed gradient aggregation process through the lens of subspace optimization. By formulating the aggregation problem as an objective-aware subspace optimization problem, we derive an efficient weighting scheme for gradients, guided by subspace coefficients. We further introduce subspace momentum to accelerate convergence while maintaining statistical unbiasedness in the aggregation. Our method demonstrates improved performance over the ubiquitous gradient averaging on multiple MLPerf tasks while remaining extremely efficient in both communicational and computational complexity.
