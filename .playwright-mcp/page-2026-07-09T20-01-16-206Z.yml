                - generic [ref=f78e1982]: =
                - generic [ref=f78e1983]: "32"
            - text: ), connected via a 100 Gb/s Infiniband network. These resource limitations prevent us from scaling our experiments to very large tasks, as discussed in Section
            - link "5.4" [ref=f78e1984] [cursor=pointer]:
