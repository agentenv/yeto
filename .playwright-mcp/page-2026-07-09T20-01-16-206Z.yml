                - /url: https://arxiv.org/html/2411.03742v1#bib.bib34
              - text: "]"
            - text: ). As a result, any performance improvements stem solely from the quality of the aggregated gradients, while the training setup remains identical to the baseline. Moreover, as described in Section
            - link "3.5" [ref=f78e1975] [cursor=pointer]:
              - /url: https://arxiv.org/html/2411.03742v1#S3.SS5
            - text: ", the method requires minimal code integration thanks to communication hooks that fully manage the aggregation process."
          - paragraph [ref=f78e1977]:
            - text: The distributed training infrastructure is constrained to a maximum of 8 nodes, each equipped with 4 RTX A6000 GPUs (48 GB per GPU), totaling 32 workers (
            - math [ref=f78e1978]:
