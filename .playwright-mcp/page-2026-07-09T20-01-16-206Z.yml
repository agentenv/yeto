          - paragraph [ref=f78e1972]:
            - text: Due to the unbiased formulation of the algorithm, the proposed aggregation method offers a parameter-free framework that eliminates the need for hyper-parameter tuning (e.g., learning rate) or modifications to the aggregation setting (e.g., double precision accumulation or aggregation of the local optimizer updates
            - generic [ref=f78e1973]:
