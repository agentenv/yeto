        - generic [ref=f78e64]:
          - heading "Abstract" [level=6] [ref=f78e65]
          - paragraph [ref=f78e66]:
            - text: Distributed machine learning has recently become a critical paradigm for training large models on vast datasets. We examine the stochastic optimization problem for deep learning within synchronous parallel computing environments under communication constraints. While averaging distributed gradients is the most widely used method for gradient estimation, whether this is the optimal strategy remains an open question. In this work, we analyze the distributed gradient aggregation process through the lens of subspace optimization. By formulating the aggregation problem as an objective-aware subspace optimization problem, we derive an efficient weighting scheme for gradients, guided by subspace coefficients. We further introduce subspace momentum to accelerate convergence while maintaining statistical unbiasedness in the aggregation. Our method demonstrates improved performance over the ubiquitous gradient averaging on multiple MLPerf tasks while remaining extremely efficient in both communicational and computational complexity. A sample implementation of the method is available at
            - link "https://github.com/yoniLc/AdaCons" [ref=f78e67] [cursor=pointer]:
              - /url: https://github.com/yoniLc/AdaCons
            - text: .
