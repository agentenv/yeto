              - text: "]"
            - text: ", where we demonstrate the performance gains of our method, AdaCons, compared to standard baseline gradient summing/averaging (referred to as Sum). All the official baseline settings and implementations can be found in the official MLPerf repository"
            - generic [ref=f78e1989]:
              - text: "["
              - link "40" [ref=f78e1990] [cursor=pointer]:
                - /url: https://arxiv.org/html/2411.03742v1#bib.bib40
              - text: "]"
            - text: . We remind the reader that our method is tested on the exact same training and evaluation settings and integrated into the same implementation. The aggregation is computed model-wise, while layer-wise aggregation presents similar performance on the tested benchmark. All batch sizes refer to the effective batch size, calculated as the local batch size multiplied by the number of workers. Finally, we do not present results for the method of
            - generic [ref=f78e1991]:
