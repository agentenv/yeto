          - paragraph [ref=f78e103]: "In this work, we propose an efficient linear subspace optimization perspective to the problem of gradient aggregation. Beyond the conceptual novelty, we make three technical contributions: (i) We first formulate the aggregation problem as a subspace optimization problem created upon the original optimization objective. (ii) We propose a first-order approximation of the solution allowing the efficient closed-form formulation of the model update. (iii) We further extend the solution with a momentum-based unbiased estimator based on the statistics of the previous subspace coefficients."
          - paragraph [ref=f78e105]: The benefits of the method are as follows. (i) The method outperforms the standard averaging technique by substantial margins on multiple training tasks while remaining scalable with respect to the number of workers. (ii) The method requires only low communication overhead and negligible computational cost. (iii) The method does not require hyper-parameter tuning (e.g., learning rate) or modification of the standard data-parallel setting.
