        - generic [ref=f78e2487]:
          - heading "6 Conclusion" [level=2] [ref=f78e2488]:
            - generic [ref=f78e2489]: "6"
            - text: Conclusion
          - paragraph [ref=f78e2491]: We introduce a novel aggregation framework for synchronous distributed training. The proposed method is derived from the subspace optimization paradigm where the workers’ gradients span the subspace in which the training objective is to be minimized. The framework enables the efficient linear weighting of gradients through a first-order approximation of the subspace optimization objective. Additionally, subspace momentum is incorporated to enhance performance, while unbiased estimation further ensures the method remains hyperparameter-free. The method requires minimal integration effort and incurs very low communication overhead, yet achieves superior accuracy and scalability compared to the standard averaging technique. By redefining gradient aggregation as an optimization problem, this framework may pave the way for the development of more advanced and high-performance aggregation methods.
