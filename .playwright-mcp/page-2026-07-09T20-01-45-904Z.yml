          - generic [ref=f101e30]: "[Submitted on 6 Jul 2021]"
          - 'heading "GradDiv: Adversarial Robustness of Randomized Neural Networks via Gradient Diversity Regularization" [level=1] [ref=f101e31]'
          - generic [ref=f101e32]:
            - link "Sungyoon Lee" [ref=f101e33] [cursor=pointer]:
              - /url: https://arxiv.org/search/cs?searchtype=author&query=Lee,+S
            - text: ","
            - link "Hoki Kim" [ref=f101e34] [cursor=pointer]:
              - /url: https://arxiv.org/search/cs?searchtype=author&query=Kim,+H
            - text: ","
            - link "Jaewook Lee" [ref=f101e35] [cursor=pointer]:
              - /url: https://arxiv.org/search/cs?searchtype=author&query=Lee,+J
          - blockquote [ref=f101e36]: Deep learning is vulnerable to adversarial examples. Many defenses based on randomized neural networks have been proposed to solve the problem, but fail to achieve robustness against attacks using proxy gradients such as the Expectation over Transformation (EOT) attack. We investigate the effect of the adversarial attacks using proxy gradients on randomized neural networks and demonstrate that it highly relies on the directional distribution of the loss gradients of the randomized neural network. We show in particular that proxy gradients are less effective when the gradients are more scattered. To this end, we propose Gradient Diversity (GradDiv) regularizations that minimize the concentration of the gradients to build a robust randomized neural network. Our experiments on MNIST, CIFAR10, and STL10 show that our proposed GradDiv regularizations improve the adversarial robustness of randomized neural networks against a variety of state-of-the-art attack methods. Moreover, our method efficiently reduces the transferability among sample models of randomized neural networks.
