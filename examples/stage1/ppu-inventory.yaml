# Stage-1 node inventory: 4 x PPU nodes, 8 x ZW-M890P 144 GiB each
# (SESSION25/N0.1-ppu-survey.md, read-only survey 2026-10-16).
# host = the SSH alias in ~/.ssh/config of the head (this server). The aliases
# do not resolve on the nodes; address = the node's eth0 IP, which the other
# nodes dial (the plan's rendezvous section must agree).
nodes:
  - name: ppu1
    host: ppu1
    address: 10.0.0.74                # eth0; order assumed, runbook S1 checks it
    device_family: ppu
    card: M890
    cards_per_node: 8
    hbm_gib: 144
    host_memory_gib: 2266
    fabric: roce
    interface: eth0
    mounts: {/data: /data}
    image: inference-xpu-pytorch-opt:v0.5.17
    runtime: docker
    roles: [trainer]
  - name: ppu2
    host: ppu2
    address: 10.0.0.75                # eth0; order assumed, runbook S1 checks it
    device_family: ppu
    card: M890
